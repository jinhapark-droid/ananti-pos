<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>어반사이드 전자영수증</title>
<style>
:root{--bg:#f2f3f5;--paper:#fff;--fg:#1d242d;--dim:#66717f;--line:#e2e5ea;--accent:#e5484d;--go:#3f9b2f;--warn:#b86e00;--info:#2f6fb5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--paper:#181e26;--fg:#e4e9ef;--dim:#94a0ae;--line:#2e3744;--accent:#ec5a5f;--go:#5bb84a;--warn:#e2a03a;--info:#6aa5e8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:16px}
.paper{max-width:440px;margin:0 auto;background:var(--paper);border-radius:12px;padding:22px 20px;box-shadow:0 2px 12px #0001}
h1{margin:0;font-size:20px;letter-spacing:.02em}
.store{color:var(--dim);font-size:14px}
.no{font-family:ui-monospace,Consolas,monospace;font-size:18px;font-weight:700;margin:14px 0 2px}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:14px 0;padding:6px 0}
.item{padding:8px 0}
.item .opt{color:var(--dim);font-size:13.5px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-left:4px}
.t-pickup{background:#3f9b2f1f;color:var(--go)} .t-ship{background:#2f6fb51f;color:var(--info)} .t-pre{background:#b86e001f;color:var(--warn)}
.note{color:var(--warn);font-size:13px}
.cx{color:var(--accent);font-size:13px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.total{font-size:19px;font-weight:700}
.notice{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:13px;white-space:pre-line}
.empty{text-align:center;color:var(--dim);padding:40px 0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="paper" id="r"><div class="empty">영수증을 불러오는 중이에요…</div></div>
<script>
const SB_URL = "https://owykoqnhwmdhpadxipes.supabase.co";
const SB_KEY = "sb_publishable_Pgf79543Sk1FvB_PtWK5PA_2U9jlGbD";
const TYPES = { pickup: "현장수령", ship: "택배배송", pre: "사전구매" };
const DEFAULT_NOTICE = "교환·반품은 구매일로부터 7일 이내, 택을 떼지 않은 미착용 상품만 가능해요. 이 영수증(주문번호)을 함께 보여 주세요.\n교환·환불은 구매하신 매장에서 백화점 결제 취소와 함께 진행돼요.\n택배·사전구매 상품은 안내된 시점에 순차 발송돼요.\n적립금과 회원 쿠폰은 오프라인 매장에서 사용할 수 없어요.";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const won = n => (Math.round(n) || 0).toLocaleString("ko-KR") + "원";
const pad = n => String(n).padStart(2, "0");
const when = t => { const d = new Date(t); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mask = n => !n ? "" : n.length <= 2 ? n[0] + "*" : n[0] + "*".repeat(n.length - 2) + n[n.length - 1];
(async () => {
  const box = document.getElementById("r");
  const t = new URLSearchParams(location.search).get("t");
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/pos_receipt`, { method: "POST", headers: { apikey: SB_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: t || "" }) });
    const j = r.ok ? await r.json() : null;
    if (!j || !j.sale) { box.innerHTML = `<div class="empty">영수증을 찾을 수 없어요.<br>링크를 다시 확인해 주세요.</div>`; return; }
    const s = j.sale, cfg = j.config || {}, st = (cfg.stores || []).find(x => x.id === j.store) || { name: "" };
    const refunded = (s.items || []).some(it => it.cq);
    box.innerHTML = `<h1>URBANSIDE</h1><div class="store">${esc(st.name)} · 전자영수증</div>
      <div class="no">${esc(s.orderNo)}</div><div class="store">${when(s.ts)}${s.custName ? ` · ${esc(mask(s.custName))} 님` : ""}</div>
      <div class="items">${(s.items || []).map(it => `<div class="item"><div class="row"><b>${esc(it.name)}</b><span class="num">${won(it.unit * it.qty)}</span></div>
        <div class="opt">${esc(it.color)} / ${esc(it.size)} · ${it.qty}개<span class="chip t-${it.type}">${TYPES[it.type] || ""}</span></div>
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ""}${it.cq ? `<div class="cx">${it.cq}개 취소·환불됨</div>` : ""}</div>`).join("")}</div>
      <div class="row"><span>정상가 합계</span><span class="num">${won(s.gross)}</span></div>
      <div class="row"><span>상품 할인</span><span class="num">−${won(s.baseDisc ?? s.disc ?? 0)}</span></div>
      ${s.promoDisc ? `<div class="row"><span>구매금액 추가할인</span><span class="num">−${won(s.promoDisc)}</span></div>` : ""}
      ${s.excDisc ? `<div class="row"><span>매장 할인</span><span class="num">−${won(s.excDisc)}</span></div>` : ""}
      <div class="row total"><span>판매금액</span><span class="num">${won(s.total)}</span></div>
      ${refunded ? `<div class="row cx"><span>일부 상품이 취소·환불됐어요</span><span></span></div>` : ""}
      ${s.exchangeOf ? `<div class="store">교환 주문 (원주문 ${esc(s.exchangeOf.orderNo)})</div>` : ""}
      <div class="notice">${esc(cfg.notice || DEFAULT_NOTICE)}</div>
      <div class="store" style="margin-top:12px;font-size:12px">결제는 매장 단말기 영수증 기준이며, 이 영수증은 구매 내역 확인용이에요.</div>`;
  } catch (e) { box.innerHTML = `<div class="empty">인터넷 연결을 확인하고 다시 열어 주세요.</div>`; }
})();
</script>
</body>
</html>
